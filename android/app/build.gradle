plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.excel_franchise_finder"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.excel_franchise_finder"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
}

flutter {
    source "../.."
}
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}
